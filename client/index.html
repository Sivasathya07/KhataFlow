<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KhataFlow — shop operations for inventory, credit, GST billing, and voice sales" />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:title" content="KhataFlow" />
    <meta property="og:description" content="One calm workspace for Indian retail: inventory, billing, credit, voice, and daily close." />
    <title>KhataFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&family=Source+Sans+3:wght@300;400;500;550;600;650;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before React mounts to prevent flash
      (function() {
        var t = localStorage.getItem('khataflow_theme') || 'system';
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
