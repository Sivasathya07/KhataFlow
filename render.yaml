services:
  - type: web
    name: khataflow-api
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ENVIRONMENT
        value: production
  - type: web
    name: khataflow-web
    runtime: docker
    dockerContext: ./client
    dockerfilePath: ./client/Dockerfile
    dockerBuildArgs:
      - key: API_URL
        value: https://khataflow-api.onrender.com
    envVars:
      - key: API_URL
        value: https://khataflow-api.onrender.com
